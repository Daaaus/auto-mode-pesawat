name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keystore disimpan sebagai secret base64. Bila belum diatur, build tetap
      # jalan memakai debug key sehingga rilis percobaan tidak gagal total.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "Keystore rilis terpasang."
          else
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "::warning::KEYSTORE_BASE64 belum diset - APK ditandatangani debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename artifacts
        id: rename
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          mkdir -p dist
          cd app/build/outputs/apk/release
          for f in *.apk; do
            case "$f" in
              *universal*) cp "$f" "$GITHUB_WORKSPACE/dist/AutoModePesawat-$TAG-universal.apk" ;;
              *arm64-v8a*) cp "$f" "$GITHUB_WORKSPACE/dist/AutoModePesawat-$TAG-arm64.apk" ;;
              *armeabi-v7a*) cp "$f" "$GITHUB_WORKSPACE/dist/AutoModePesawat-$TAG-arm32.apk" ;;
            esac
          done
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh

      - name: Verify signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for f in dist/*.apk; do
            echo "--- $f"
            "$BT/apksigner" verify --print-certs "$f" | head -3
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: Auto Mode Pesawat ${{ steps.rename.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ## Unduh

            | Berkas | Untuk |
            |---|---|
            | `AutoModePesawat-*-arm64.apk` | Mayoritas HP modern (disarankan) |
            | `AutoModePesawat-*-arm32.apk` | HP lama 32-bit |
            | `AutoModePesawat-*-universal.apk` | Semua perangkat |

            Butuh **Shizuku** yang sedang berjalan. Android 11+.

            > Signature: ${{ steps.keystore.outputs.signed == 'true' && 'release key' || 'DEBUG key (uji coba)' }}
